<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAPA - PREV</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px Segoe UI,Arial;background:#eef3f8;color:#17304a}header{position:fixed;z-index:1000;top:0;left:0;right:0;background:#123b69;color:#fff;padding:10px;box-shadow:0 3px 12px #0004}h1{font-size:17px;margin:0 0 7px}.row{display:flex;gap:6px}input,select,button{border:0;border-radius:9px;padding:10px;font:inherit}header input{flex:1;min-width:0}.info{font-size:11px;margin-top:6px}#map{position:fixed;inset:105px 0 0;height:auto}.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;border:3px solid #fff;box-shadow:0 2px 7px #0007}.me{width:22px;height:22px;border-radius:50%;background:#1677ff;border:4px solid #fff;box-shadow:0 0 0 8px #1677ff44}.nearest{filter:drop-shadow(0 0 7px #ffe600)}.sheet{position:fixed;z-index:1500;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:15px;box-shadow:0 -6px 24px #0004;transform:translateY(105%);transition:.25s;max-height:76vh;overflow:auto}.sheet.open{transform:translateY(0)}.sheet h2{font-size:17px;margin:0 35px 5px 0}.close{position:absolute;right:12px;top:10px;background:#e8eef4;color:#17304a;font-weight:bold}.detail{font-size:12px;color:#5b7186;line-height:1.5;margin-bottom:10px}.field{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}.sheet input{width:100%;border:1px solid #cbd8e5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn{background:#1677ff;color:#fff;font-weight:700}.green{background:#168547}.nearBtn{position:fixed;z-index:900;right:12px;bottom:18px;background:#fff;color:#174b7c;box-shadow:0 3px 14px #0004;font-weight:700}.toast{position:fixed;z-index:2000;top:115px;left:10px;right:10px;background:#17304a;color:#fff;padding:11px;border-radius:8px;display:none}@media(min-width:800px){header,.sheet{left:calc(50% - 400px);right:calc(50% - 400px)}#map{left:calc(50% - 400px);right:calc(50% - 400px)}}</style></head><body>
<header><h1>Mapa PM - Equipe de Campo</h1><div class="row"><input id="q" placeholder="Buscar OS, referência ou defeito"><select id="filter"><option value="P">Pendentes</option><option value="T">Todas</option><option value="E">Executadas</option></select></div><div class="info"><span id="sync">Conectando...</span> · <span id="count">0 OS</span> · <span id="gps">Localizando equipe...</span></div></header><div id="map"></div><button id="nearBtn" class="nearBtn">◎ OS mais próxima</button>
<section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="title"></h2><div id="detail" class="detail"></div><label class="field">Equipe</label><input id="team" placeholder="Informe a equipe"><label class="field">Horário inicial</label><input id="start" type="time"><label class="field">Horário final</label><input id="end" type="time"><div class="actions"><button id="route" class="btn">📍 Abrir rota</button><button id="execute" class="btn green">✓ Registrar execução</button></div></section><div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getFirestore,collection,doc,onSnapshot,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDUtDGz4mBqSf3jQsC7nNWT7NaB-vDBybA',authDomain:'mapaprev-d1661.firebaseapp.com',projectId:'mapaprev-d1661',storageBucket:'mapaprev-d1661.firebasestorage.app',messagingSenderId:'174138618270',appId:'1:174138618270:web:2bcb8d2e2076c5653d668f'};const db=getFirestore(initializeApp(cfg)),tasks=collection(db,'atividades'),iconsRef=collection(db,'config_icons');const $=x=>document.getElementById(x),norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){if(typeof v==='number')return Number.isFinite(v)?v:0;let s=String(v??'').trim().replace(/\s/g,'').replace(',','.');let n=Number(s);return Number.isFinite(n)?n:0}function coord(v){let n=num(v);return Math.abs(n)<=180?n:0}function val(r,...ks){for(const k of ks)if(r[k]!==undefined&&r[k]!=='')return r[k];return''}function done(r){return ['EXECUT','CONCLU','REALIZ','FINALIZ'].some(x=>norm(r.STATUS).includes(x))}function svc(r){return norm(r.TIPO||r.DEFEITO||'OUTROS')}function osOf(r){return val(r,'OS CORREÇÃO','OS CORRECAO','OS\nCORREÇÃO','OS\nCORRECAO','OS NO CLICK')||'SEM OS'}
let rows=[],icons={},position=null,current=null,meMarker=null,nearest=null;const map=L.map('map',{preferCanvas:true}).setView([-9.75,-42.7],9),markers=L.featureGroup().addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
function visible(){let q=norm($('q').value),f=$('filter').value;return rows.filter(r=>(f==='T'||(f==='E'?done(r):!done(r)))&&(!q||norm(Object.values(r).join(' ')).includes(q)))}function locateNearest(a){nearest=null;if(!position)return;let best=Infinity;a.filter(r=>!done(r)).forEach(r=>{let lat=coord(val(r,'LATITUDE','lat')),lon=coord(val(r,'LONGITUDE','lon'));if(!lat||!lon)return;let d=map.distance(position,[lat,lon]);if(d<best){best=d;nearest={r,lat,lon,d}}});$('gps').textContent=nearest?`Mais próxima: ${(nearest.d/1000).toFixed(1).replace('.',',')} km`:'Equipe localizada'}
function draw(){let a=visible();markers.clearLayers();locateNearest(a);a.forEach(r=>{let lat=coord(val(r,'LATITUDE','latitude','lat')),lon=coord(val(r,'LONGITUDE','longitude','lon'));if(!lat||!lon||Math.abs(lat)>90)return;let d=done(r),icfg=icons[svc(r)]||{},color=d?'#16a34a':(icfg.color||'#dc2626'),sym=icfg.icon||(svc(r)==='PODA'?'🌳':'⚡'),isNear=nearest&&nearest.r._id===r._id,icon=L.divIcon({className:isNear?'nearest':'',html:`<div class="ico" style="background:${color}">${sym}</div>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([lat,lon],{icon}).on('click',()=>openTask(r)).addTo(markers)});$('count').textContent=`${a.length} OS`}
function openTask(r){current=r;let lat=coord(val(r,'LATITUDE','lat')),lon=coord(val(r,'LONGITUDE','lon'));$('title').textContent='OS '+osOf(r);$('detail').innerHTML=`<b>${esc(svc(r))}</b> · Qtd. ${num(r.QTD??r.qtd)}<br>Referência: ${esc(val(r,'REF. ELÉTRICA','REF. ELETRICA'))}<br>Defeito: ${esc(r.DEFEITO||'')}<br>Status: ${esc(r.STATUS||'PENDENTE')}`;$('team').value=r.EQUIPE_EXECUCAO||'';$('start').value=r.HORARIO_INICIAL||new Date().toTimeString().slice(0,5);$('end').value=r.HORARIO_FINAL||'';$('route').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`,'_blank');$('sheet').classList.add('open')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}$('close').onclick=()=>$('sheet').classList.remove('open');$('q').oninput=draw;$('filter').onchange=draw;$('nearBtn').onclick=()=>{if(!position)return requestLocation();locateNearest(visible());if(nearest){map.setView([nearest.lat,nearest.lon],17);openTask(nearest.r)}else toast('Nenhuma OS pendente com coordenadas')};
$('execute').onclick=async()=>{if(!current)return;let team=$('team').value.trim(),start=$('start').value,end=$('end').value;if(!team||!start||!end)return toast('Preencha equipe, horário inicial e final');if(!position)return toast('Aguarde a localização automática');try{await updateDoc(doc(tasks,current._id),{STATUS:'EXECUTADA','DATA EXEC':new Date().toLocaleDateString('pt-BR'),EQUIPE_EXECUCAO:team,HORARIO_INICIAL:start,HORARIO_FINAL:end,LOCAL_EXECUCAO:{latitude:position.lat,longitude:position.lng,precisao:position.accuracy||null},updatedAt:serverTimestamp()});$('sheet').classList.remove('open');toast('Execução registrada com data e localização')}catch(e){toast(e.message)}};
function requestLocation(){if(!navigator.geolocation)return toast('Geolocalização não disponível');$('gps').textContent='Localizando equipe...';navigator.geolocation.getCurrentPosition(p=>{position={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};if(meMarker)map.removeLayer(meMarker);meMarker=L.marker([position.lat,position.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).bindTooltip('Localização atual da equipe',{permanent:false}).addTo(map);map.setView([position.lat,position.lng],14);draw()},e=>{$('gps').textContent='Localização não autorizada';toast('Permita o acesso à localização no navegador')},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
onSnapshot(iconsRef,s=>{icons={};s.forEach(d=>icons[d.data().type]=d.data());draw()});onSnapshot(tasks,s=>{rows=s.docs.map(d=>({_id:d.id,...d.data()}));$('sync').textContent='● Sincronizado';draw()},e=>{$('sync').textContent='Sem acesso';toast(e.message)});setTimeout(()=>map.invalidateSize(true),250);requestLocation();
</script></body></html>
